[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-to-dashboard-lab"
version = "0.1.0"
description = "An educational reconstruction of a traceable chat-to-dashboard data agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "sqlglot>=27,<31", "numpy>=1.26,<3"]

[project.scripts]
dashboard-lab = "dashboard_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dashboard_agent = ["assets/*.json", "web/*.html"]
